<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>room notice</title>
  <meta name="description" content="a tiny printer that observes the room once a day, in one line" />
  <style>
    /* SAV9 tokens — verified against ~/mirrors/kim2/taste-library/2026-08-16-artifact-house-style-tokens.md */
    :root {
      --bg:          #eeeade;
      --surface:     #f8f6ee;
      --surface-2:   #e2ddcc;
      --ink:         #201f1a;
      --ink-muted:   #6b6759;
      --ink-faint:   #948f7d;
      --line:        #d8d2bd;
      --accent:      #a9791f;
      --accent-soft: #e9dcb8;
      --slip-paper:  #faf6e8;
      --slip-shadow: rgba(32,31,26,0.08);
      --printer-body:#d8d0bb;
      --printer-line:#b5ab94;
      --shadow:      0 1px 2px rgba(32,31,26,0.06), 0 8px 24px -12px rgba(32,31,26,0.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:          #16150f;
        --surface:     #1f1d16;
        --surface-2:   #2a2620;
        --ink:         #ece7d8;
        --ink-muted:   #a39d8a;
        --ink-faint:   #75705f;
        --line:        #38332a;
        --accent:      #dba53f;
        --accent-soft: #4a3a1f;
        --slip-paper:  #2a2618;
        --slip-shadow: rgba(0,0,0,0.4);
        --printer-body:#2e2a20;
        --printer-line:#3a3528;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header.sticky {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      padding: 18px 28px 16px;
      display: flex;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      flex-shrink: 0;
    }
    .eyebrow {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--ink-muted);
      margin: 0;
    }
    h1.title {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.01em;
      margin: 0;
      color: var(--ink);
    }

    main {
      padding: 36px 28px 28px;
      display: grid;
      place-items: center;
    }
    .stage {
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
    }

    /* Printer — drawn in CSS */
    .printer {
      background: var(--printer-body);
      border: 1px solid var(--printer-line);
      border-radius: 14px;
      padding: 18px 22px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
    }
    .printer .label {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
    }
    .printer .caption {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      font-size: 12px;
      color: var(--ink);
      margin-top: 4px;
    }
    .printer .led {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--ink-faint);
      box-shadow: 0 0 6px transparent;
      transition: background 600ms, box-shadow 600ms;
    }
    .printer .led.live {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-soft);
    }
    .printer-actions {
      margin-top: 12px;
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }
    .re-roll {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      font-size: 12px;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      transition: background 200ms, border-color 200ms, color 200ms;
    }
    .re-roll:hover, .re-roll:focus-visible {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--ink);
      outline: none;
    }
    .re-roll[disabled] {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .arm {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      font-size: 11px;
      color: var(--ink-faint);
    }
    .arm button {
      color: var(--accent);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      font: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .arm button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 2px;
    }

    /* Slip — the printed observation */
    .slip {
      background: var(--slip-paper);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 24px 28px;
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      font-size: 14px;
      line-height: 1.7;
      color: var(--ink);
      box-shadow: var(--shadow);
      position: relative;
      animation: print-in 1.6s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: top center;
    }
    .slip::before, .slip::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 6px;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0 8px,
          rgba(32,31,26,0.06) 8px 10px
        );
    }
    .slip::before { top: 0; border-radius: 4px 4px 0 0; }
    .slip::after  { bottom: 0; border-radius: 0 0 4px 4px; }
    .slip .observation {
      margin: 0;
      padding: 4px 0;
    }
    .slip .cite {
      margin-top: 14px;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-faint);
      border-top: 1px dashed var(--line);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .slip .cite .source { color: var(--ink-muted); }
    @media (prefers-reduced-motion: reduce) {
      .slip { animation: none; }
    }
    @keyframes print-in {
      0%   { opacity: 0; transform: translateY(-22px); }
      60%  { opacity: 1; transform: translateY(2px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* 7-day strip */
    .strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }
    .strip .slot {
      aspect-ratio: 3 / 4;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      font-size: 9px;
      line-height: 1.3;
      color: var(--ink-muted);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 200ms, background 200ms;
    }
    .strip .slot.gold {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--ink);
    }
    .strip .slot .day {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
      font-size: 8px;
    }
    .strip .slot.gold .day { color: var(--accent); }
    .strip .slot.empty {
      background: transparent;
      border-style: dashed;
      justify-content: center;
      align-items: center;
      color: var(--ink-faint);
    }

    .meta-block {
      padding: 14px 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      font-size: 12px;
      color: var(--ink-muted);
      line-height: 1.7;
    }
    .meta-block .row { display: flex; justify-content: space-between; gap: 12px; }
    .meta-block .row .k { color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; }
    .meta-block .row .v { color: var(--ink); }
    .meta-block .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--ink-muted);
      font-size: 10px;
      letter-spacing: 0.06em;
    }
    .meta-block .pill.gold { background: var(--accent-soft); color: var(--accent); }

    footer.colophon {
      padding: 22px 28px;
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      font-size: 11px;
      color: var(--ink-faint);
      text-align: center;
      border-top: 1px solid var(--line);
    }
    footer.colophon a { color: var(--ink-muted); text-decoration: none; border-bottom: 1px dotted var(--line); }
    footer.colophon a:hover { color: var(--accent); border-color: var(--accent); }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <header class="sticky" role="banner">
    <span class="dot" aria-hidden="true"></span>
    <p class="eyebrow">room notice</p>
    <h1 class="title">a tiny printer that observes the room once a day, in one line</h1>
  </header>

  <main role="main">
    <div class="stage">
      <!-- Printer -->
      <section class="printer" aria-label="thermal printer">
        <div>
          <div class="label">status</div>
          <div class="caption" id="status-caption">waiting for the quiet moment…</div>
        </div>
        <div class="led" id="led" aria-hidden="true"></div>
        <div class="printer-actions">
          <button class="re-roll" id="re-roll" type="button" disabled aria-describedby="roll-count">
            ↻ new slip
          </button>
          <span class="arm" id="arm-prompt">
            <button type="button" id="arm">arm the printer</button> · permission: ready
          </span>
          <span class="arm" id="roll-count" aria-live="polite"></span>
        </div>
      </section>

      <!-- Slip -->
      <section id="slip-region" aria-label="today's slip" aria-live="polite">
        <p class="slip" id="slip" hidden>
          <span class="observation" id="slip-text"></span>
          <span class="cite">
            <span class="source" id="slip-source">—</span>
            <span id="slip-time">—</span>
          </span>
        </p>
      </section>

      <!-- 7-day strip -->
      <section class="strip" id="strip" aria-label="last seven slips">
        <!-- 7 slots rendered by JS -->
      </section>

      <!-- Meta -->
      <section class="meta-block" aria-label="system status">
        <div class="row">
          <span class="k">fire-at</span>
          <span class="v" id="meta-fire">—</span>
        </div>
        <div class="row">
          <span class="k">source</span>
          <span class="v"><span class="pill" id="meta-source">idle</span></span>
        </div>
        <div class="row">
          <span class="k">rolls today</span>
          <span class="v" id="meta-rolls">0</span>
        </div>
      </section>
    </div>

    <p class="sr-only" id="live-region" aria-live="polite"></p>
  </main>

  <footer class="colophon" role="contentinfo">
    room-notice · built sunday 27 sep 2026 · <a href="https://github.com/agentSumi/room-notice">source</a> · sav9 tokens · no webfonts · no backend
  </footer>

  <script>
    /* Room-Notice — time fires → webcam sample → MobileNet caption → slip prints.
       No accounts. No log. No notification. Ambient-only (the camera samples at a time already passing). */

    const el = {
      statusCaption: document.getElementById('status-caption'),
      led:           document.getElementById('led'),
      arm:           document.getElementById('arm'),
      armPrompt:     document.getElementById('arm-prompt'),
      reRoll:        document.getElementById('re-roll'),
      rollCount:     document.getElementById('roll-count'),
      slip:          document.getElementById('slip'),
      slipText:      document.getElementById('slip-text'),
      slipSource:    document.getElementById('slip-source'),
      slipTime:      document.getElementById('slip-time'),
      strip:         document.getElementById('strip'),
      metaFire:      document.getElementById('meta-fire'),
      metaSource:    document.getElementById('meta-source'),
      metaRolls:     document.getElementById('meta-rolls'),
      live:          document.getElementById('live-region'),
    };

    /* ---- Config ---- */
    const params = new URLSearchParams(location.search);
    const FIRE_HOUR = parseInt(params.get('hour') || '14', 10);
    const FIRE_MIN  = parseInt(params.get('min')  || '30', 10);
    const STORAGE_KEY = 'room-notice-slips';
    const MAX_SLIPS   = 7;

    /* ---- Built-in sentence-of-the-day fallback (camera-denied path) ----
       30+ observations Kim can re-roll through. Tied to the day-of-year so the
       same sentence doesn't appear twice in a row. */
    const FALLBACK_SENTENCES = [
      'mug is in a new place today',
      'the light moved at 2pm',
      'a chair pulled closer to the desk',
      'the plant looks taller than yesterday',
      'a book opened to a different page',
      'the lamp is on earlier than usual',
      'a paper folded into quarters',
      'pen cap left on the left side today',
      'cup of tea, half-full',
      'window is open a crack',
      'a scarf draped over the chair',
      'the desk is unusually clear',
      'three objects lined up by height',
      'a postcard propped against the lamp',
      'something moved overnight',
      'phone face-down for once',
      'a snack wrapper in the corner',
      'the cat is not here',
      'sun is coming from a new angle',
      'a notebook open to a blank page',
      'shoes at the door instead of inside',
      'the room smells different today',
      'keys placed on the desk, not the hook',
      'a pen without its cap',
      'a glass of water, almost empty',
      'the room is unusually tidy',
      'a cushion out of place',
      'today the desk has a visitor',
      'a postcard arrived in the mail',
      'morning light on a different wall',
      'an empty chair pulled out',
      'a long shadow across the floor',
    ];

    /* ---- State ---- */
    let armed = false;
    let stream = null;
    let model  = null;     // MobileNet
    let modelLoading = false;
    let modelLoaded  = false;
    let rollCount = 0;
    let slips = loadSlips();

    function loadSlips() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      } catch (e) { return []; }
    }
    function saveSlips() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(slips.slice(-MAX_SLIPS)));
      } catch (e) { /* storage full or denied — non-fatal */ }
    }

    function todayKey(d = new Date()) {
      return d.toISOString().slice(0, 10);
    }

    /* ---- Strip rendering ---- */
    function renderStrip() {
      el.strip.innerHTML = '';
      const today = todayKey();
      const ordered = slips.slice(-MAX_SLIPS);
      const padCount = MAX_SLIPS - ordered.length;
      for (let i = 0; i < padCount; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot empty';
        slot.textContent = '—';
        slot.setAttribute('aria-hidden', 'true');
        el.strip.appendChild(slot);
      }
      ordered.forEach((s, idx) => {
        const slot = document.createElement('div');
        const isToday = s.date === today;
        slot.className = 'slot' + (isToday ? ' gold' : '');
        const day = new Date(s.date + 'T00:00:00').toLocaleDateString([], { weekday: 'short' });
        slot.innerHTML = `<div class="day">${day}</div><div>${escapeHtml(truncate(s.caption, 80))}</div>`;
        el.strip.appendChild(slot);
      });
    }

    function truncate(s, n) {
      return s.length > n ? s.slice(0, n - 1) + '…' : s;
    }
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }

    /* ---- Slip rendering ---- */
    function renderSlip(slip) {
      el.slip.hidden = false;
      el.slipText.textContent = slip.caption;
      el.slipSource.textContent = slip.source;
      el.slipTime.textContent = new Date(slip.date + 'T' + (slip.time || '00:00')).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      el.statusCaption.textContent = slip.caption;
      el.led.classList.add('live');
    }

    /* ---- Sentence mapping ----
       ImageNet labels → 1-line observation. If label not in map, use a generic template. */
    const LABEL_TO_OBSERVATION = {
      'coffee_mug':      'mug is in a new place today',
      'cup':             'a cup left out',
      'espresso_maker':  'the espresso maker has been used today',
      'water_bottle':    'water bottle, half-empty',
      'desk':            'the desk looks different today',
      'lamp':            'the lamp is on earlier than usual',
      'notebook':        'a notebook open to a new page',
      'paper':           'a paper folded into quarters',
      'book':            'a book opened to a different page',
      'pen':             'a pen without its cap',
      'pencil_box':      'pencils out of the box',
      'cellular_telephone':'phone face-down for once',
      'laptop':          'laptop lid slightly open',
      'mouse':           'the mouse is on the wrong side',
      'monitor':         'monitor tilted differently today',
      'chair':           'a chair pulled closer to the desk',
      'potted_plant':    'the plant looks taller than yesterday',
      'vase':            'a vase with new flowers',
      'window':          'window is open a crack',
      'curtain':         'curtain pulled to one side',
      'pillow':          'a cushion out of place',
      'couch':           'a cushion out of place',
      'scarf':           'a scarf draped over the chair',
      'shoe':            'shoes at the door instead of inside',
      'sock':            'a sock, single, on the floor',
      'sunglasses':      'sunglasses on the desk',
      'keys':            'keys placed on the desk, not the hook',
      'wallet':          'wallet out of the usual pocket',
      'mail':            'a postcard arrived in the mail',
      'envelope':        'envelope opened this morning',
      'plate':           'a plate returned to the shelf',
      'bowl':            'a bowl, washed and stacked',
      'spoon':           'a spoon left out',
      'fork':            'a fork, single, on a napkin',
      'knife':           'a knife block has a gap',
      'wine_bottle':     'a bottle opened tonight',
      'beer_glass':      'a glass, half-full',
      'orange':          'an orange, peeled',
      'banana':          'a banana, half-eaten',
      'apple':           'an apple on the desk',
      'sandwich':        'a sandwich wrapped in paper',
      'broccoli':        'broccoli, slightly wilted',
      'lemon':           'a lemon cut in half',
    };
    function mapLabelToObservation(label, confidence) {
      if (confidence !== undefined && confidence < 0.5) {
        return pickFallbackSentence();
      }
      if (LABEL_TO_OBSERVATION[label]) {
        return LABEL_TO_OBSERVATION[label];
      }
      /* Generic template: "something <label> is in the room today" */
      const pretty = label.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      return `something ${pretty} in the room today`;
    }
    function pickFallbackSentence() {
      const today = todayKey();
      const seed = parseInt(today.replace(/-/g, ''), 10);
      const idx = (seed + slips.length) % FALLBACK_SENTENCES.length;
      return FALLBACK_SENTENCES[idx];
    }

    /* ---- MobileNet loader (lazy — only when first needed) ---- */
    function loadMobileNet() {
      if (modelLoaded || modelLoading) return Promise.resolve();
      modelLoading = true;
      return new Promise((resolve) => {
        /* We use a CDN-hosted MobileNet via TensorFlow.js.
           If the CDN is unreachable or the model fails to load, we resolve anyway
           and the fallback sentence-of-the-day path takes over. */
        const timeout = setTimeout(() => {
          modelLoading = false;
          resolve();
        }, 8000);
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@1.0.0/dist/mobilenet.min.js';
        script.async = true;
        script.onload = () => {
          clearTimeout(timeout);
          if (window.mobilenet && typeof window.mobilenet.load === 'function') {
            window.mobilenet.load({ version: 1, alpha: 0.25 }).then(m => {
              model = m;
              modelLoaded = true;
              modelLoading = false;
              resolve();
            }).catch(() => {
              modelLoading = false;
              resolve();
            });
          } else {
            modelLoading = false;
            resolve();
          }
        };
        script.onerror = () => {
          clearTimeout(timeout);
          modelLoading = false;
          resolve();
        };
        document.head.appendChild(script);
      });
    }

    /* ---- Frame → caption pass ---- */
    async function captureFrame() {
      if (!stream) return null;
      const video = document.createElement('video');
      video.srcObject = stream;
      video.muted = true;
      video.playsInline = true;
      await new Promise(r => { video.onloadedmetadata = r; video.play().catch(() => {}); });
      const canvas = document.createElement('canvas');
      canvas.width = 224; canvas.height = 224;
      const ctx = canvas.getContext('2d');
      /* Allow one frame to render */
      await new Promise(r => setTimeout(r, 250));
      ctx.drawImage(video, 0, 0, 224, 224);
      return canvas;
    }

    async function captionFrame() {
      if (!modelLoaded) await loadMobileNet();
      if (!model) {
        return { caption: pickFallbackSentence(), source: 'hand-written · model unavailable' };
      }
      try {
        const canvas = await captureFrame();
        if (!canvas) return { caption: pickFallbackSentence(), source: 'hand-written · no camera' };
        const preds = await model.classify(canvas, 3);
        if (!preds || preds.length === 0) {
          return { caption: pickFallbackSentence(), source: 'hand-written · no labels' };
        }
        const top = preds[0];
        return {
          caption: mapLabelToObservation(top.className.toLowerCase(), top.probability),
          source: `mobilenet · ${top.className} · ${(top.probability * 100).toFixed(0)}%`,
        };
      } catch (e) {
        return { caption: pickFallbackSentence(), source: 'hand-written · error' };
      }
    }

    /* ---- Fire path ---- */
    let firedToday = false;
    async function maybeFire() {
      const now = new Date();
      const tk = todayKey(now);
      if (firedToday && todayKey() === tk) return;
      if (now.getHours() !== FIRE_HOUR || now.getMinutes() !== FIRE_MIN) return;
      firedToday = true;
      await printNewSlip('time-fired');
    }

    async function printNewSlip(reason) {
      el.statusCaption.textContent = 'observing the room…';
      const { caption, source } = await captionFrame();
      const now = new Date();
      const today = todayKey(now);
      const time = now.toTimeString().slice(0, 5);

      /* Remove any existing slip for today (so re-roll replaces the time-fired one). */
      slips = slips.filter(s => s.date !== today);

      const slip = { date: today, time, caption, source, reason };
      slips.push(slip);
      saveSlips();

      rollCount++;
      el.metaRolls.textContent = rollCount;
      el.rollCount.textContent = `slip ${rollCount} of ${rollCount} · ${reason}`;
      el.metaSource.textContent = source.split(' · ')[0];
      el.metaSource.className = 'pill' + (source.startsWith('mobilenet') ? '' : ' gold');
      el.reRoll.disabled = false;

      renderStrip();
      renderSlip(slip);

      el.live.textContent = `slip printed: ${caption}`;
    }

    /* ---- Arming ---- */
    async function arm() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 224, height: 224 } });
      } catch (e) {
        /* Camera denied — the caption pass will fall through to fallback sentences. */
      }
      armed = true;
      el.armPrompt.innerHTML = '<span class="pill">armed</span> · waiting for the quiet moment';
      el.reRoll.disabled = false;
      el.statusCaption.textContent = stream
        ? 'armed · waiting for the quiet moment'
        : 'armed · no camera · will print from hand-written sentences';
      el.led.classList.add('live');

      /* Pre-load the model in the background — non-blocking. */
      loadMobileNet();

      /* Render existing strip + meta. */
      renderStrip();
      const today = todayKey();
      const existing = slips.find(s => s.date === today);
      if (existing) {
        renderSlip(existing);
        rollCount = 1;
        el.metaRolls.textContent = rollCount;
        el.rollCount.textContent = `slip 1 of 1 · restored`;
      }
      el.metaFire.textContent = `${String(FIRE_HOUR).padStart(2,'0')}:${String(FIRE_MIN).padStart(2,'0')}`;
    }

    el.arm.addEventListener('click', arm);

    el.reRoll.addEventListener('click', async () => {
      if (!armed) return;
      el.reRoll.disabled = true;
      await printNewSlip('manual re-roll');
      el.reRoll.disabled = false;
    });

    /* ---- Tick loop: check if it's time to fire ---- */
    function tick() {
      maybeFire();
      setTimeout(tick, 30 * 1000); // every 30s
    }
    tick();

    /* ---- Initial render: empty strip until armed ---- */
    renderStrip();
    el.metaFire.textContent = `${String(FIRE_HOUR).padStart(2,'0')}:${String(FIRE_MIN).padStart(2,'0')}`;
  </script>
</body>
</html>
